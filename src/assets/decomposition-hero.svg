<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="70" x2="1100" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#120E28"/>
    </linearGradient>
    <linearGradient id="panel" x1="250" y1="160" x2="940" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1F1B3A"/>
    </linearGradient>
    <linearGradient id="cyan" x1="240" y1="180" x2="940" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="violet" x1="260" y1="190" x2="940" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="blue" x1="260" y1="260" x2="920" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.05  0 1 0 0 0.72  0 0 1 0 0.9  0 0 0 0.65 0"/>
    </filter>
  </defs>

  <rect width="1200" height="800" rx="40" fill="url(#bg)"/>
  <circle cx="240" cy="180" r="130" fill="#06B6D4" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="970" cy="620" r="170" fill="#A855F7" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="630" cy="140" r="90" fill="#3B82F6" fill-opacity="0.10" filter="url(#glow)"/>

  <g opacity="0.8">
    <path d="M330 245C430 220 520 205 600 205C683 205 774 220 874 245" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 12"/>
    <path d="M330 560C430 585 520 600 600 600C683 600 774 585 874 560" stroke="#A855F7" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 12"/>
  </g>

  <g filter="url(#glow)">
    <rect x="268" y="178" width="664" height="344" rx="42" fill="url(#cyan)" fill-opacity="0.12"/>
  </g>
  <rect x="252" y="162" width="696" height="376" rx="44" fill="url(#panel)" stroke="rgba(255,255,255,0.20)" stroke-width="2"/>

  <rect x="330" y="232" width="540" height="108" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
  <text x="600" y="280" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="700" fill="#F8FAFC">큰 일 하나</text>
  <text x="600" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#C4B5FD">한 번에 맡기면 너무 크고 복잡함</text>

  <g>
    <path d="M599 350V398" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round"/>
    <path d="M599 398L579 378" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round"/>
    <path d="M599 398L619 378" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <g filter="url(#glow)">
    <rect x="320" y="418" width="130" height="84" rx="22" fill="url(#violet)" fill-opacity="0.95"/>
    <rect x="485" y="418" width="130" height="84" rx="22" fill="url(#blue)" fill-opacity="0.95"/>
    <rect x="650" y="418" width="130" height="84" rx="22" fill="url(#cyan)" fill-opacity="0.95"/>
    <rect x="815" y="418" width="130" height="84" rx="22" fill="#111827" stroke="#22D3EE" stroke-opacity="0.9" stroke-width="2"/>
  </g>

  <text x="385" y="455" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">단계 1</text>
  <text x="550" y="455" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">단계 2</text>
  <text x="715" y="455" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">단계 3</text>
  <text x="880" y="450" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#A5F3FC">AI</text>
  <text x="880" y="474" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#E2E8F0">하나씩 처리</text>

  <g opacity="0.75">
    <path d="M450 460H485" stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>
    <path d="M615 460H650" stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>
    <path d="M780 460H815" stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="600" y="610" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">큰 일을 작은 단계로 쪼개면 AI가 더 잘 이해한다</text>
  <text x="600" y="648" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#C4B5FD">업무 분해 = 지시를 나누는 능력</text>
</svg>
